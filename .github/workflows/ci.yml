name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    zizmor:
        name: Zizmor
        runs-on: ubuntu-latest

        steps:
            - name: Check out the repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Audit GitHub Actions and Dependabot
              uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
              with:
                  inputs: .github
                  advanced-security: false
                  strict-collection: true
                  persona: pedantic

    quality:
        name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php:
                    - '8.2'
                    - '8.3'
                    - '8.4'
                    - '8.5'
                dependencies:
                    - locked
                    - lowest

        steps:
            - name: Check out the repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false

            - name: Set up PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2

            - name: Install locked dependencies
              if: matrix.dependencies == 'locked'
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Install lowest supported dependencies
              if: matrix.dependencies == 'lowest'
              run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

            - name: Run quality checks
              run: composer quality
